<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="/User Login App/static/style.css">
    </head>
    <body>
        <div align="center" class="border">
            <div class="header">
                <h1 class="word">Login</h1>
            </div>

            <h2 class="word">
                <form action="/login" method="post">
                    <div class="msg">{{msg}}</div>
                    <input type="text" id="username" name="username" placeholder="Please enter your username" class="textbox">

                    <br>
                    <br>

                    <input type="password" id="password" name="password" placeholder="Pleas enter a safe and memorable Password" class="textbox">

                    <br>
                    <br>

                    <input type="submit" value="Log In" class="btn">

                    <br>
                    <br>
                </form>
            </h2>

            <p class="bottom">Don't have a account? <a herf="/register" class="button">Sign up</a></p>
        </div>
    </body>
</html>
