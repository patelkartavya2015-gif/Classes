<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BMI Calculator</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="title">
            <h1>Welcome to BMI Calculator</h1>
        </div>

        <div class="body">
            <form action="/calculate" method="POST">
                <label for="height">Height (cm):</label>
                <input id="height" name="height" placeholder="Please enter height" type="number" step="0.1" min="1" required>
                <br><br>
                <label for="weight">Weight (kg):</label>
                <input id="weight" name="weight" placeholder="Please enter weight" type="number" step="0.1" min="1" required>
                <br><br>
                <button type="submit">Calculate BMI</button>
            </form>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% elif bmi is not none %}
                <p class="result">Your BMI is: {{ bmi }}</p>
            {% endif %}
        </div>
    </body>
</html>
